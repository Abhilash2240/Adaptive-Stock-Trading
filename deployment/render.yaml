# render.yaml — Backend-only service on Render
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: adaptive-stock-trading-api
    runtime: docker
    dockerfilePath: ./deployment/Dockerfile.backend
    # Persistent disks require a paid service plan; change free to starter before deploying.
    plan: free            # change to "starter" for persistent model storage and no cold starts
    disk:
      name: agent-models
      mountPath: /app/backend/models
      sizeGB: 1
    healthCheckPath: /api/v1/status
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PORT
        value: "8001"
      - key: DATA_PROVIDER
        value: twelvedata
      - key: TWELVEDATA_API_KEY
        sync: false       # set manually in Render dashboard
      - key: DATABASE_URL
        sync: false       # set manually — Neon PostgreSQL connection string
      - key: AUTH0_DOMAIN
        sync: false       # set manually in Render dashboard
      - key: AUTH0_AUDIENCE
        sync: false       # set manually in Render dashboard
      - key: AUTH0_ROLES_CLAIM
        value: https://yourapp/roles
      - key: OPENROUTER_API_KEY
        sync: false       # set manually in Render dashboard
      - key: SYMBOLS
        value: AAPL,MSFT,TSLA,GOOGL,AMZN
      # Replace this placeholder with the real Vercel URL before or immediately after deploy.
      - key: ALLOWED_ORIGINS
        value: https://your-app.vercel.app,http://localhost:5173,http://localhost:3000
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: AUDIT_LOG_ENABLED
        value: "true"
      - key: TRUST_PROXY
        value: "true"
